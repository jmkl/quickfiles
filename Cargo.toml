[workspace]
resolver = "3"
members = ["crates/quickfiles", "crates/quickfiles-core"]

[workspace.dependencies]
eframe = { version = "0.37", default-features = false, features = [
  "default_fonts",
  "wgpu",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
