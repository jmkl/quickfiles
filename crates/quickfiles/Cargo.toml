[package]
name = "quickfiles"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { workspace = true }
quickfiles-core = { path = "../quickfiles-core" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true


[[bin]]
name = "qf"
path = "src/main.rs"
